{{define "admin.html"}}
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 赛博琥珀</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/admin.js"></script></head>
<body><header class="topbar"><div class="brand">✦ 赛博琥珀 / ADMIN</div><a href="/">公开页面</a></header><main class="shell">
<section id="login-panel" class="panel"><div class="step">AUTH</div><div class="panel-body"><h1>管理员登录</h1><form id="login-form"><label>管理员密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><p id="login-status" role="alert"></p></form></div></section>
<div id="admin-panel" class="hidden">
<section class="panel"><div class="step">BOT</div><div class="panel-body"><h2>机器人、账号与运行参数</h2><pre id="account-status" class="status-box"></pre><div class="actions"><button id="qr-button">扫码登录</button><button id="check-account" class="secondary">检查 Cookie</button><button id="pause-button" class="danger">暂停机器人</button><button id="resume-button" class="secondary">恢复机器人</button><button id="logout-button" class="secondary">退出</button></div><div id="qr-box" class="hidden"><img id="qr-image" alt="B站扫码登录二维码"><p id="qr-status"></p></div><details><summary>从受保护环境导入 Cookie</summary><label>Cookie<textarea id="cookie-input" rows="4" autocomplete="off"></textarea></label><button id="cookie-button">验证并加密保存</button></details></div></section>
<section class="panel"><div class="step">SETTINGS</div><div class="panel-body"><h2>运行参数</h2><p class="hint">保存前会进行与启动时相同的完整校验；为保证队列与并发语义一致，新参数在服务重启后生效。</p><label>非敏感运行设置（JSON）<textarea id="settings-json" rows="24" spellcheck="false" autocomplete="off"></textarea></label><div class="actions"><button id="save-settings">校验并保存</button><button id="reload-settings" class="secondary">重新载入</button><button id="reset-settings" class="danger">恢复部署配置</button></div><p id="settings-status" role="status"></p></div></section>
<section class="panel"><div class="step">QUEUE</div><div class="panel-body"><h2>最近任务</h2><button id="refresh-jobs" class="secondary">刷新</button><div class="table-wrap"><table><thead><tr><th>任务</th><th>来源</th><th>状态</th><th>进度</th><th>错误</th><th>操作</th></tr></thead><tbody id="jobs-body"></tbody></table></div><pre id="job-detail" class="status-box hidden" aria-live="polite"></pre></div></section>
<section class="panel"><div class="step">ABUSE</div><div class="panel-body"><h2>黑名单</h2><form id="block-form" class="form-grid"><label>主体类型<select id="block-type"><option value="bili_mid">B站 MID</option><option value="ip">IP</option></select></label><label>主体 ID<input id="block-id" required></label><label>原因<input id="block-reason" required maxlength="200"></label><label>到期时间（可空）<input id="block-expiry" type="datetime-local"></label><button type="submit">加入黑名单</button></form><div class="table-wrap"><table><thead><tr><th>类型</th><th>ID</th><th>原因</th><th>到期</th><th>操作</th></tr></thead><tbody id="blocked-body"></tbody></table></div></div></section>
<section class="panel"><div class="step">AUDIT</div><div class="panel-body"><h2>审计日志</h2><div class="actions"><button id="refresh-audit" class="secondary">刷新</button><button id="clear-cache" class="danger">清理视频与弹幕缓存</button></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>动作</th><th>目标</th><th>请求 ID</th></tr></thead><tbody id="audit-body"></tbody></table></div></div></section>
</div></main></body></html>
{{end}}
