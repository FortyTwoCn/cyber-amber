limit_req_zone $binary_remote_addr zone=cyber_amber_public:10m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name amber.example.com;

    # Configure ssl_certificate and ssl_certificate_key with your certificate manager.
    client_max_body_size 1m;

    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/v1/jobs/ {
        limit_req zone=cyber_amber_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        limit_req zone=cyber_amber_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
