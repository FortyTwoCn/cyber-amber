// Protocol subset used by x/v2/dm/web/seg.so.
// Field numbers match bilibili.community.service.dm.v1.
syntax = "proto3";

package bilibili.community.service.dm.v1;

option go_package = "github.com/FortyTwoCn/cyber-amber/internal/bili/danmaku/pb;pb";

message DmSegMobileReply {
  repeated DanmakuElem elems = 1;
  int32 state = 2;
  DanmakuAIFlag ai_flag = 3;
}

message DanmakuElem {
  int64 id = 1;
  int32 progress = 2;
  int32 mode = 3;
  int32 fontsize = 4;
  uint32 color = 5;
  string mid_hash = 6;
  string content = 7;
  int64 ctime = 8;
  int32 weight = 9;
  string action = 10;
  int32 pool = 11;
  string id_str = 12;
  int32 attr = 13;
  string animation = 14;
}

message DanmakuAIFlag {
  repeated DanmakuFlag dm_flags = 1;
}

message DanmakuFlag {
  int64 dmid = 1;
  uint32 flag = 2;
}
